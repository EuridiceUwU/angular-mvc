<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text white">Control de Orden de Producción</div>
    <div class="card-body">
      <h5> Producto: {{order.product}}</h5>
      <p>Cantidad: {{order.quantity}}</p>
      <p>Capacidad de máquina: {{order.machineCapacity}}</p>
      <p>
        Estado:
        <span class="badge bg-info text-dark">
          {{order.state}}
        </span>
      </p>
      <div class="mt-3">
        <button class="btn btn-success me-2" (click)="startOrder()">Iniciar</button>
      </div>
      <div class="mt-3">
        <button class="btn btn-danger" (click)="finishOrder()">Finalizar</button>
      </div>
    </div>
  </div>
</div>
