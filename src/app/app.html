<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">Sistema de Orden de Producción</div>

    <div class="card-body">
      <!-- Interpolación -->
      <h4>{{ order.product }}</h4>

      <p>Cantidad actual: {{ order.quantity }}</p>
      <p>Capacidad máquina: {{ order.machineCapacity }}</p>

      <!-- Property Binding -->
      <p>
        Estado:
        <span
          class="badge"
          [ngClass]="{
            'bg-secondary': order.state === 'pendiente',
            'bg-warning': order.state === 'en_proceso',
            'bg-success': order.state === 'finalizada',
          }"
        >
          {{ order.state }}
        </span>
      </p>

      <!-- Two-way Binding -->
      <div class="mb-3">
        <label>Nueva Cantidad</label>
        <input type="number" class="form-control" [(ngModel)]="newQantity" />
      </div>

      <button class="btn btn-info me-2" (click)="updateQantity()">Actualizar Cantidad</button>

      <!-- Event Binding -->
      <button class="btn btn-success me-2" (click)="start()">Iniciar</button>

      <button
        class="btn btn-danger"
        [disabled]="order.state !== 'en_proceso'"
        (click)="finish()"
      >
        Finalizar
      </button>

      <!-- Implementación del bloque de control dee flujo @if-->
      @if (message) {
        <div class="alert alert-warning mt-3">
          {{ message }}
        </div>
      }

      <!-- Uso de método del modelo -->
      <p class="mt-3">
        Eficiencia:
        <strong>{{ order.getEfficiency() }}</strong>
      </p>
    </div>
  </div>
</div>
